name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 校验 tag 与 package.json 版本一致
        run: |
          node -e "
            const version = require('./package.json').version;
            const tag = process.env.GITHUB_REF_NAME;
            if (tag !== 'v' + version) {
              console.error('tag ' + tag + ' 与 package.json 的 v' + version + ' 不一致，请先同步版本再打 tag');
              process.exit(1);
            }
            console.log('版本一致：' + tag);
          "

  publish-tauri:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: ubuntu-22.04-arm
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Linux 系统依赖
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '大英默写器 Pro v__VERSION__'
          releaseBody: |
            安装包见下方 Assets：

            - macOS：`aarch64` 对应 Apple 芯片，`x64` 对应 Intel
            - Windows：`.exe`（NSIS 安装器）或 `.msi`
            - Linux：`.deb` / `.AppImage` / `.rpm`

            安装包未经代码签名。macOS 首次打开如提示无法验证，请在「系统设置 → 隐私与安全性」中允许打开，或右键应用选择「打开」；Windows 出现 SmartScreen 提示时选择「仍要运行」。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
